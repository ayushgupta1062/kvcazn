name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Root requirements.txt (Vercel) must equal backend/requirements.txt (Docker)
        run: diff -u ../requirements.txt requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wind-desk .
      - name: Smoke test the image (uses the committed snapshot, or demo data if there is none)
        run: |
          docker run -d --rm -p 8000:8000 -e REQUIRE_REAL_DATA=0 --name smoke wind-desk
          for i in $(seq 1 40); do curl -fsS localhost:8000/api/health && break || sleep 1; done
          curl -fsS localhost:8000/api/meta | head -c 400; echo
          curl -fsS "localhost:8000/api/decision?decisionDate=2026-01-14&cutoff=09:50" | head -c 300; echo
          curl -fsS localhost:8000/ | grep -q "Day-ahead wind desk"
          docker logs smoke

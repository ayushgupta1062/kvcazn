name: refresh-data
# Actions tab -> "refresh-data" -> Run workflow. Downloads January 2026 from Elexon on GitHub's servers
# and commits backend/data/snapshot, so nothing has to be installed locally.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Probe the API first (small request per dataset)
        working-directory: backend
        run: python -m app.ingest --check
      - name: Download the full window
        working-directory: backend
        run: python -m app.ingest
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/snapshot
          if git diff --cached --quiet; then echo "Snapshot unchanged"; else git commit -m "Refresh Elexon snapshot" && git push; fi
